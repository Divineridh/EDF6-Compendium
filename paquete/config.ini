# Tecla para abrir el overlay (codigo virtual de Windows).
# F1=0x70  F2=0x71  F3=0x72  F4=0x73  Insert=0x2D  Fin=0x23
tecla=0x70

# Filtro de foco: evitaria que la tecla dispare mientras estas en otra
# aplicacion. Viene APAGADO porque con EDF6 no funciona: Windows nunca reporta
# la ventana del juego como la de adelante, asi que el filtro terminaba tapando
# la tecla durante los primeros segundos de cada partida. Encendelo solo si
# sabes que lo necesitas.
#foco=1

# La tecla se busca por tres caminos a la vez, porque segun la maquina puede
# fallar cualquiera de ellos. Esto apaga el primero (el sondeo directo) y sirve
# para comprobar que los otros dos andan. Dejalo comentado para jugar.
#sondeo=0
