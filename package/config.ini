# Key that opens the overlay (Windows virtual-key code).
# F1=0x70  F2=0x71  F3=0x72  F4=0x73  Insert=0x2D  End=0x23
key=0x70

# Focus filter: would keep the key from firing while you are in another
# application. It comes OFF because it doesn't work with EDF6: Windows never
# reports the game's window as the one in front, so the filter ended up blocking
# the key during the first seconds of every session. Turn it on only if you know
# you need it.
#focus=1

# The key is looked for through three paths at once, because any of them can
# fail depending on the machine. This turns off the first one (direct polling)
# and is useful to check that the other two work. Leave it commented to play.
#poll=0
